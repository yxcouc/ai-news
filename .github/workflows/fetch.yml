name: Fetch AI News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-news-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RSSHUB_BASE: ${{ secrets.RSSHUB_BASE }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_FALLBACK_MODEL: ${{ vars.AI_FALLBACK_MODEL }}
          AI_INPUT_CHARS: ${{ vars.AI_INPUT_CHARS }}
          AI_TIMEOUT_SECONDS: ${{ vars.AI_TIMEOUT_SECONDS }}
          AI_RETRIES: ${{ vars.AI_RETRIES }}
          AI_RETRY_BACKOFF_SECONDS: ${{ vars.AI_RETRY_BACKOFF_SECONDS }}
          FETCH_TIMEOUT_SECONDS: ${{ vars.FETCH_TIMEOUT_SECONDS }}
          FETCH_RETRIES: ${{ vars.FETCH_RETRIES }}
          FETCH_BACKOFF_SECONDS: ${{ vars.FETCH_BACKOFF_SECONDS }}
          PER_FEED_LIMIT: ${{ vars.PER_FEED_LIMIT }}
        run: python scripts/fetch.py
